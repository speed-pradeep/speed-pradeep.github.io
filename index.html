<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Games - PRADEEP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    color:white;
    background:
      radial-gradient(circle at 20% 20%,#35147a 0,transparent 25%),
      radial-gradient(circle at 80% 30%,#082c75 0,transparent 25%),
      radial-gradient(circle at 50% 80%,#4b0870 0,transparent 30%),
      #02030d;
    overflow-x:hidden;
}

/* GALAXY STARS */
body:before,
body:after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(2px 2px at 20px 30px,#fff,transparent),
      radial-gradient(1px 1px at 90px 80px,#fff,transparent),
      radial-gradient(2px 2px at 150px 150px,#fff,transparent),
      radial-gradient(1px 1px at 250px 40px,#fff,transparent),
      radial-gradient(2px 2px at 350px 190px,#fff,transparent),
      radial-gradient(1px 1px at 450px 100px,#fff,transparent);
    background-size:500px 250px;
    animation:stars 18s linear infinite;
    opacity:.6;
    z-index:-1;
}

@keyframes stars{
    from{transform:translateY(0)}
    to{transform:translateY(250px)}
}

header{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
    background:rgba(3,4,20,.8);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,.15);
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#7ee8ff;
}

.home-btn,
.close-btn{
    border:0;
    padding:11px 18px;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,#5d2cff,#00aaff);
    cursor:pointer;
    font-weight:bold;
}

.welcome{
    text-align:center;
    padding:75px 20px 35px;
}

.welcome h1{
    font-size:clamp(38px,7vw,78px);
    text-shadow:0 0 20px #00d9ff,0 0 50px #6b35ff;
    animation:pulse 2s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.025)}
}

.creator{
    margin-top:15px;
    color:#ffd86b;
    font-size:24px;
    font-weight:bold;
}

.subtitle{
    margin-top:15px;
    color:#cdd6ff;
}

.title{
    text-align:center;
    margin:25px 0;
    font-size:38px;
}

.game-menu{
    max-width:1250px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.game-button{
    min-height:205px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:22px;
    color:white;
    cursor:pointer;
    padding:25px 15px;
    background:rgba(255,255,255,.07);
    backdrop-filter:blur(12px);
    transition:.25s;
    box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.game-button:hover{
    transform:translateY(-8px) scale(1.02);
    border-color:#5beaff;
    box-shadow:0 0 30px #3a82ff;
}

.game-icon{
    font-size:55px;
    margin-bottom:12px;
}

.game-button h3{
    font-size:20px;
    margin-bottom:8px;
}

.game-button p{
    color:#aeb9df;
}

.game-screen{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:
      radial-gradient(circle,#15245d,#02030d 65%);
    overflow:auto;
    padding:25px;
}

.game-inner{
    max-width:900px;
    min-height:90vh;
    margin:auto;
    text-align:center;
    padding:20px;
}

.game-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.game-title{
    font-size:32px;
}

.score{
    font-size:22px;
    margin:15px;
}

.start-btn{
    border:0;
    padding:14px 25px;
    border-radius:14px;
    background:linear-gradient(135deg,#ff2bd6,#5b4bff);
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin:15px;
}

.status{
    font-size:22px;
    margin:20px;
}

canvas{
    max-width:100%;
    border:2px solid #6ceeff;
    border-radius:15px;
    background:#02030b;
    box-shadow:0 0 25px #146cff;
}

.ttt-board{
    width:330px;
    max-width:90vw;
    margin:25px auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.ttt-cell{
    aspect-ratio:1;
    font-size:45px;
    border:0;
    border-radius:12px;
    color:white;
    background:#151d49;
    cursor:pointer;
}

.reaction-box{
    width:min(600px,90vw);
    height:280px;
    margin:30px auto;
    border-radius:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    background:#16204c;
    cursor:pointer;
}

.click-area{
    position:relative;
    width:min(700px,90vw);
    height:400px;
    margin:auto;
    background:#07102b;
    border:2px solid #2d68ff;
    border-radius:20px;
    overflow:hidden;
}

.target{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#ff267d;
    box-shadow:0 0 25px #ff267d;
    display:none;
    cursor:pointer;
}

.question{
    font-size:27px;
    padding:25px;
    margin:20px auto;
    max-width:700px;
    background:#111b43;
    border-radius:15px;
}

.quiz-answer{
    display:block;
    width:min(600px,90%);
    margin:10px auto;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#182558;
    color:white;
    cursor:pointer;
    font-size:17px;
}

.quiz-answer:hover{
    background:#3154b9;
}

.big-action{
    width:min(600px,90%);
    height:220px;
    margin:30px auto;
    border:0;
    border-radius:25px;
    color:white;
    font-size:30px;
    font-weight:bold;
    background:linear-gradient(135deg,#0a72ff,#8d22ff);
    cursor:pointer;
}

.number-input{
    padding:14px;
    border-radius:10px;
    border:2px solid #4969ff;
    background:#080e2c;
    color:white;
    font-size:20px;
    width:180px;
    text-align:center;
}

.memory-grid{
    display:grid;
    grid-template-columns:repeat(4,90px);
    justify-content:center;
    gap:10px;
    margin:25px;
}

.card{
    width:90px;
    height:90px;
    border:0;
    border-radius:12px;
    background:#182658;
    color:white;
    font-size:35px;
    cursor:pointer;
}

footer{
    text-align:center;
    padding:40px;
    color:#8995c5;
}

.win{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
    display:none;
}

.blast{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:80px;
    animation:blast 1s ease-out forwards;
}

@keyframes blast{
    0%{
        transform:translate(-50%,-50%) scale(.2);
        opacity:1;
    }
    100%{
        transform:translate(-50%,-50%) scale(3);
        opacity:0;
    }
}

@media(max-width:600px){
    header{
        padding:14px;
    }

    .welcome{
        padding-top:50px;
    }

    .game-menu{
        grid-template-columns:repeat(2,1fr);
        padding:10px;
        gap:10px;
    }

    .game-button{
        min-height:180px;
        padding:15px 8px;
    }

    .game-icon{
        font-size:40px;
    }

    .game-title{
        font-size:22px;
    }
}
</style>
</head>

<script>

const screen=document.getElementById("gameScreen");
const title=document.getElementById("gameTitle");
const content=document.getElementById("gameContent");

function openGame(game){
    screen.style.display="block";

    const games={
        snake:"🐍 Snake Galaxy",
        ttt:"❌ Tic Tac Toe",
        reaction:"⚡ Reaction Rush",
        target:"🎯 Target Hunter",
        quiz:"🧠 Galaxy Quiz",
        clicker:"🖱️ Fast Clicker",
        rps:"✊ Rock Paper Scissors",
        number:"🔢 Number Guess",
        memory:"🃏 Memory Match",
        math:"➕ Math Challenge",
        color:"🎨 Color Match",
        whack:"🐹 Whack A Mole",
        pong:"🏓 Galaxy Pong",
        space:"🚀 Space Shooter",
        breaker:"🧱 Brick Breaker",
        flappy:"🐦 Flappy Galaxy",
        dodge:"☄️ Meteor Dodge",
        aim:"🎯 Aim Trainer",
        word:"🔤 Word Scramble",
        connect:"🔴 Connect Four"
    };

    title.innerText=games[game]||"Galaxy Game";

    if(game==="snake") snake();
    if(game==="ttt") ticTacToe();
    if(game==="reaction") reaction();
    if(game==="target") targetGame();
    if(game==="quiz") quiz();
    if(game==="clicker") clicker();
    if(game==="rps") rps();
    if(game==="number") numberGuess();
    if(game==="memory") memory();
    if(game==="math") mathGame();
    if(game==="color") colorGame();
    if(game==="whack") whack();
    if(game==="pong") pong();
    if(game==="space") space();
    if(game==="breaker") breaker();
    if(game==="flappy") flappy();
    if(game==="dodge") dodge();
    if(game==="aim") aim();
    if(game==="word") word();
    if(game==="connect") connect();
}

function closeGame(){
    screen.style.display="none";
    content.innerHTML="";
}

/* WIN EFFECT */

function winEffect(){
    const w=document.getElementById("win");
    w.style.display="block";

    setTimeout(()=>{
        w.style.display="none";
    },1000);
}

/* SNAKE */

function snake(){
content.innerHTML=`
<div class="score">Score: <span id="ss">0</span></div>
<canvas id="snakeCanvas" width="500" height="500"></canvas>
<br>
<button class="start-btn" onclick="startSnake()">▶ START GAME</button>
<p>Use Arrow Keys to control the snake.</p>`;

window.startSnake=function(){

let c=document.getElementById("snakeCanvas");
let ctx=c.getContext("2d");
let box=25;
let snake=[{x:250,y:250}];
let dx=box,dy=0;
let score=0;

let food={
 x:Math.floor(Math.random()*20)*box,
 y:Math.floor(Math.random()*20)*box
};

document.onkeydown=e=>{
if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-box}
if(e.key==="ArrowDown"&&dy===0){dx=0;dy=box}
if(e.key==="ArrowLeft"&&dx===0){dx=-box;dy=0}
if(e.key==="ArrowRight"&&dx===0){dx=box;dy=0}
};

clearInterval(window.snakeTimer);

window.snakeTimer=setInterval(()=>{

ctx.clearRect(0,0,500,500);

snake.forEach((p,i)=>{
ctx.fillStyle=i===0?"#00ffff":"#38ff72";
ctx.fillRect(p.x,p.y,box-2,box-2);
});

ctx.fillStyle="#ff267d";
ctx.beginPath();
ctx.arc(food.x+12,food.y+12,10,0,Math.PI*2);
ctx.fill();

let head={
x:snake[0].x+dx,
y:snake[0].y+dy
};

if(head.x<0||head.x>=500||head.y<0||head.y>=500){
clearInterval(window.snakeTimer);
alert("Game Over! Score: "+score);
return;
}

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){
score++;
document.getElementById("ss").innerText=score;
winEffect();

food={
x:Math.floor(Math.random()*20)*box,
y:Math.floor(Math.random()*20)*box
};
}else{
snake.pop();
}

},120);
};
}

/* TIC TAC TOE */

function ticTacToe(){
content.innerHTML=`
<div class="status" id="tttStatus">Player X Turn</div>
<div class="ttt-board" id="board"></div>
<button class="start-btn" onclick="ticTacToe()">🔄 RESTART</button>`;

let cells=[];
let turn="X";
let active=true;

const board=document.getElementById("board");
const status=document.getElementById("tttStatus");

for(let i=0;i<9;i++){
let b=document.createElement("button");
b.className="ttt-cell";
b.onclick=()=>{
if(!active||b.innerText)return;

b.innerText=turn;

let wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

cells[i]=turn;

if(wins.some(x=>x.every(n=>cells[n]===turn))){
status.innerText="🏆 Player "+turn+" Wins!";
active=false;
winEffect();
}else if(cells.filter(Boolean).length===9){
status.innerText="Draw!";
active=false;
}else{
turn=turn==="X"?"O":"X";
status.innerText="Player "+turn+" Turn";
}
};
board.appendChild(b);
}
}

/* REACTION */

function reaction(){
content.innerHTML=`
<div class="reaction-box" id="reactionBox">Click START</div>
<div class="score">Time: <span id="reactionScore">-</span> ms</div>
<button class="start-btn" onclick="startReaction()">▶ START</button>`;

window.startReaction=function(){
let box=document.getElementById("reactionBox");
let score=document.getElementById("reactionScore");

box.innerText="WAIT...";
box.style.background="#9b162c";

let delay=1000+Math.random()*3000;

clearTimeout(window.reactTimer);

window.reactTimer=setTimeout(()=>{
box.innerText="CLICK NOW!";
box.style.background="#168b45";

let start=performance.now();

box.onclick=()=>{
let time=Math.round(performance.now()-start);
score.innerText=time;

if(time<300)winEffect();

box.onclick=null;
};
},delay);
};
}

/* TARGET */

function targetGame(){
content.innerHTML=`
<div class="score">Score: <span id="targetScore">0</span></div>
<div class="click-area" id="targetArea">
<div class="target" id="target"></div>
</div>
<button class="start-btn" onclick="startTarget()">▶ START</button>`;

window.startTarget=function(){

let score=0;
let target=document.getElementById("target");
let area=document.getElementById("targetArea");

function move(){
target.style.display="block";
target.style.left=Math.random()*(area.clientWidth-55)+"px";
target.style.top=Math.random()*(area.clientHeight-55)+"px";
}

target.onclick=()=>{
score++;
document.getElementById("targetScore").innerText=score;
if(score%5===0)winEffect();
move();
};

move();
};
}

/* QUIZ */

function quiz(){
content.innerHTML=`
<div class="score">Score: <span id="quizScore">0</span></div>
<div class="question" id="question"></div>
<div id="answers"></div>
<button class="start-btn" onclick="startQuiz()">▶ START QUIZ</button>`;

window.startQuiz=function(){

let score=0;
let index=0;

const questions=[
["Which planet is known as the Red Planet?",["Earth","Mars","Venus","Jupiter"],1],
["How many days are in a week?",["5","6","7","8"],2],
["Which language is used for web pages?",["HTML","Python","C","Java"],0],
["How many sides does a triangle have?",["2","3","4","5"],1],
["Which is the largest planet?",["Mars","Earth","Jupiter","Mercury"],2],
["What does CPU stand for?",["Central Processing Unit","Computer Power Unit","Control Program Unit","Central Print Unit"],0]
];

function show(){
let q=questions[index];

document.getElementById("question").innerText=q[0];

let a=document.getElementById("answers");
a.innerHTML="";

q[1].forEach((x,i)=>{
let b=document.createElement("button");
b.className="quiz-answer";
b.innerText=x;

b.onclick=()=>{
if(i===q[2]){
score++;
winEffect();
}
document.getElementById("quizScore").innerText=score;

index++;

if(index<questions.length)show();
else{
document.getElementById("question").innerText=
"🏆 Quiz Finished! Score: "+score+"/"+questions.length;
a.innerHTML="";
}
};

a.appendChild(b);
});
}

show();
};
}

/* CLICKER */

function clicker(){
content.innerHTML=`
<div class="score">Clicks: <span id="clickScore">0</span></div>
<div class="reaction-box" id="clickBox">Click START</div>
<button class="start-btn" onclick="startClicker()">▶ START</button>`;

window.startClicker=function(){

let score=0;
let time=10;

let box=document.getElementById("clickBox");

box.innerText="CLICK!";
box.onclick=()=>{
score++;
document.getElementById("clickScore").innerText=score;
};

clearInterval(window.clickTimer);

window.clickTimer=setInterval(()=>{
time--;

if(time<=0){
clearInterval(window.clickTimer);
box.innerText="TIME UP! Score: "+score;
box.onclick=null;

if(score>=10)winEffect();
}else{
box.innerText="CLICK! "+time+"s";
}
},1000);
};
}

/* ROCK PAPER SCISSORS */

function rps(){
content.innerHTML=`
<div class="score" id="rpsResult">Choose!</div>
<button class="start-btn" onclick="playRPS('Rock')">✊ Rock</button>
<button class="start-btn" onclick="playRPS('Paper')">✋ Paper</button>
<button class="start-btn" onclick="playRPS('Scissors')">✌️ Scissors</button>`;

window.playRPS=function(player){

let arr=["Rock","Paper","Scissors"];
let computer=arr[Math.floor(Math.random()*3)];

let result;

if(player===computer)result="Draw!";
else if(
(player==="Rock"&&computer==="Scissors")||
(player==="Paper"&&computer==="Rock")||
(player==="Scissors"&&computer==="Paper")
){
result="🏆 YOU WIN!";
winEffect();
}else result="Computer Wins!";

document.getElementById("rpsResult").innerText=
"You: "+player+" | Computer: "+computer+" → "+result;
};
}

/* NUMBER GUESS */

function numberGuess(){
content.innerHTML=`
<p>Guess a number between 1 and 100.</p>
<br>

/* PONG */

function pong(){
content.innerHTML=`
<canvas id="pongCanvas" width="700" height="400"></canvas>
<br>
<button class="start-btn" onclick="startPong()">▶ START</button>
<p>Use W/S or Arrow Up/Down.</p>`;

window.startPong=function(){

let c=document.getElementById("pongCanvas");
let ctx=c.getContext("2d");

let py=170;
let cy=170;
let bx=350;
let by=200;
let vx=5;
let vy=3;
let running=true;

document.onkeydown=e=>{
if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")py-=30;
if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")py+=30;
};

function loop(){

if(!running)return;

ctx.fillStyle="#02030d";
ctx.fillRect(0,0,700,400);

ctx.fillStyle="#00ffff";
ctx.fillRect(20,py,15,80);

ctx.fillStyle="#ff39c8";
ctx.fillRect(665,cy,15,80);

ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(bx,by,10,0,Math.PI*2);
ctx.fill();

bx+=vx;
by+=vy;

if(by<10||by>390)vy*=-1;

if(bx<45&&by>py&&by<py+80)vx=Math.abs(vx);
if(bx>655&&by>cy&&by<cy+80)vx=-Math.abs(vx);

cy+=(by-(cy+40))*.05;

if(bx<0||bx>700){
running=false;
alert("Pong finished!");
}

requestAnimationFrame(loop);
}

loop();
};
}

/* SPACE SHOOTER */

function space(){
content.innerHTML=`
<canvas id="spaceCanvas" width="700" height="450"></canvas>
<br>
<button class="start-btn" onclick="startSpace()">▶ START</button>
<p>Move with Arrow Keys. Press SPACE to shoot.</p>`;

window.startSpace=function(){

let c=document.getElementById("spaceCanvas");
let ctx=c.getContext("2d");

let player={x:330,y:400};
let bullets=[];
let enemies=[];
let score=0;
let keys={};

document.onkeydown=e=>{
keys[e.key]=true;

if(e.code==="Space"){
bullets.push({x:player.x+20,y:player.y});
}
};

document.onkeyup=e=>keys[e.key]=false;

for(let i=0;i<10;i++){
enemies.push({
x:Math.random()*650,
y:Math.random()*200
});
}

function loop(){

ctx.fillStyle="#02030d";
ctx.fillRect(0,0,700,450);

if(keys.ArrowLeft)player.x-=5;
if(keys.ArrowRight)player.x+=5;

player.x=Math.max(0,Math.min(660,player.x));

ctx.font="35px Arial";
ctx.fillText("🚀",player.x,player.y);

bullets.forEach(b=>b.y-=8);

enemies.forEach(e=>{
ctx.fillText("👾",e.x,e.y);
e.y+=.5;
});

ctx.fillStyle="white";
bullets.forEach(b=>ctx.fillRect(b.x,b.y,4,15));

bullets.forEach(b=>{
enemies.forEach(e=>{
if(Math.abs(b.x-e.x)<30&&Math.abs(b.y-e.y)<30){
e.x=Math.random()*650;
e.y=0;
score++;

if(score%5===0)winEffect();
}
});
});

ctx.fillStyle="white";
ctx.font="20px Arial";
ctx.fillText("Score: "+score,20,30);

requestAnimationFrame(loop);
}

loop();
};
}

/* BRICK BREAKER */

function breaker(){
content.innerHTML=`
<canvas id="brickCanvas" width="700" height="450"></canvas>
<br>
<button class="start-btn" onclick="startBreaker()">▶ START</button>`;

window.startBreaker=function(){

let c=document.getElementById("brickCanvas");
let ctx=c.getContext("2d");

let ball={x:350,y:350,vx:4,vy:-4};
let paddle={x:300,w:100};
let bricks=[];

for(let r=0;r<4;r++){
for(let col=0;col<8;col++){
bricks.push({
x:20+col*85,
y:40+r*35,
alive:true
});
}
}

document.onmousemove=e=>{
paddle.x=e.clientX-c.getBoundingClientRect().left-50;
};

function loop(){

ctx.fillStyle="#02030d";
ctx.fillRect(0,0,700,450);

ctx.fillStyle="#00eaff";
ctx.fillRect(paddle.x,420,paddle.w,15);

ctx.fillStyle="#fff";
ctx.beginPath();
ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
ctx.fill();

bricks.forEach(b=>{
if(b.alive){
ctx.fillStyle="#7b35ff";
ctx.fillRect(b.x,b.y,75,25);
}
});

ball.x+=ball.vx;
ball.y+=ball.vy;

if(ball.x<8||ball.x>692)ball.vx*=-1;
if(ball.y<8)ball.vy*=-1;

if(ball.y>410&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){
ball.vy=-Math.abs(ball.vy);
}

bricks.forEach(b=>{
if(b.alive&&ball.x>b.x&&ball.x<b.x+75&&
ball.y>b.y&&ball.y<b.y+25){
b.alive=false;
ball.vy*=-1;
winEffect();
}
});

if(ball.y>450){
alert("Game Over!");
return;
}

requestAnimationFrame(loop);
}

loop();
};
}

/* CONNECT FOUR */

function connect(){
content.innerHTML=`
<div class="status" id="connectStatus">🔴 Player 1</div>
<div id="connectBoard"
style="
display:grid;
grid-template-columns:repeat(7,55px);
gap:5px;
justify-content:center;
background:#143a9b;
padding:10px;
border-radius:15px;">
</div>
<button class="start-btn" onclick="connect()">🔄 RESTART</button>`;

let board=document.getElementById("connectBoard");
let cells=Array(42).fill("");
let player="🔴";

for(let i=0;i<42;i++){

let b=document.createElement("button");

b.style.width="55px";
b.style.height="55px";
b.style.border="0";
b.style.borderRadius="50%";
b.style.background="#07102c";
b.style.fontSize="25px";
b.style.cursor="pointer";

b.onclick=()=>{

let col=i%7;

for(let row=5;row>=0;row--){

let index=row*7+col;

if(!cells[index]){

cells[index]=player;
b=document.querySelectorAll("#connectBoard button")[index];
b.innerText=player;

if(checkConnect(index)){
document.getElementById("connectStatus").innerText=
"🏆 "+player+" WINS!";
winEffect();
return;
}

player=player==="🔴"?"🟡":"🔴";

document.getElementById("connectStatus").innerText=
player+" Turn";

break;
}
}
};

board.appendChild(b);
}

function checkConnect(index){

let r=Math.floor(index/7);
let c=index%7;

let directions=[[0,1],[1,0],[1,1],[1,-1]];

for(let [dr,dc] of directions){

let count=1;

for(let d of [-1,1]){

let nr=r+dr*d;
let nc=c+dc*d;

while(nr>=0&&nr<6&&nc>=0&&nc<7&&
cells[nr*7+nc]===player){

count++;
nr+=dr*d;
nc+=dc*d;
}
}

if(count>=4)return true;
}

return false;
}

}
